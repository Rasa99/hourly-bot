name: hourly-bot

# Trades every hour, free, with your PC off.
#
# DESIGN NOTE - why one job runs for hours instead of one job per hour:
#
# The obvious build is a cron every hour. It does not work. GitHub's scheduler
# is explicitly best-effort: it delays runs under load, silently drops them,
# and new repositories often wait hours before the first one fires. Measured
# here: the schedule was registered and active, and fired ZERO times across
# :07, :27 and :47 attempts.
#
# So the job no longer needs an hourly trigger. It starts once and then keeps
# going by itself, doing one cycle per hour for up to five and a half hours
# (GitHub kills any job at six). One successful trigger buys most of a day.
#
# The crons remain as restart attempts. With `concurrency` set, a trigger that
# lands while the loop is still running is simply queued, never doubled.

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '27 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # 5h50m; GitHub's hard ceiling is 6h

    steps:
      - name: Get the code and the bot's memory
        uses: actions/checkout@v7
        with:
          # Without an explicit ref, checkout lands on a DETACHED HEAD: the
          # commit succeeds and the push fails with "not currently on a branch".
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # Needs a requirements file to hash, or it fails the whole run.
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install freqtrade
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Trade, once an hour, for as long as this job is allowed to live
        env:
          # ABSOLUTE path. A relative db_url depends on the working directory,
          # which has silently broken this project twice.
          #
          # This is the LIVE database, and it deliberately sits in the runner's
          # temp directory rather than in the repository. freqtrade now runs
          # continuously, so this file is being written to at all times; the
          # copy git commits is a consistent snapshot taken from it each hour
          # (bot_tools.py snapshot), never the file itself.
          FT_LIVE_DB: ${{ runner.temp }}/live_cloud.sqlite
          # freqtrade's OWN Telegram is deliberately OFF.
          #
          # Telegram permits exactly one getUpdates poller per bot token. With
          # freqtrade polling AND telegram_listener.py polling, they knocked
          # each other off every few seconds:
          #   "Conflict: terminated by other getUpdates request"
          # and neither could answer anything reliably.
          #
          # So there is now one poller: telegram_listener.py, which lives for
          # the job's whole 5+ hours instead of only while freqtrade is up.
          # Trade alerts and the hourly summary are sent by this workflow
          # instead, which also means they still arrive between cycles.
          FREQTRADE__TELEGRAM__ENABLED: "false"
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p user_data/logs
          git config user.name  "hourly-bot"
          git config user.email "hourly-bot@users.noreply.github.com"

          # Start the Telegram listener alongside the trading loop, so /status
          # and /closest are answered for the job's whole life rather than only
          # during the few minutes freqtrade itself is up. Read-only: it can
          # report, never trade. If it dies, trading is unaffected.
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            LISTEN_SECONDS=19800 python telegram_listener.py \
              > user_data/logs/listener.log 2>&1 &
            echo "telegram listener started (pid $!)"
          fi

          # Print what execution settings are ACTUALLY in force. A comment in
          # the config used to claim market orders while freqtrade's defaults
          # are limit on entry, exit and stoploss; nothing printed the real
          # values, so the two disagreed for weeks unnoticed.
          python bot_tools.py execconfig || true

          # ---- restore the bot's memory into a WORKING copy ---------------
          # The live database now lives outside the repository. freqtrade no
          # longer stops between cycles, so the file it writes cannot also be
          # the file git commits - copying it mid-transaction captures a torn
          # page, and removing its -wal from under an open handle loses writes.
          python bot_tools.py seed

          # ---- freqtrade now runs CONTINUOUSLY ----------------------------
          # It used to run for 300 seconds per hour. That meant the stop was
          # unenforced for the other 55 minutes: stoploss_on_exchange is false,
          # so the stop is bot-managed and only exists while the process does.
          # Price could blow through a stop at :20 and the bot would not act
          # until :07 the next hour, exiting wherever price had got to - which
          # a backtest, checking every candle's high and low, cannot reproduce.
          #
          # Running it for the job's whole life takes stop coverage from about
          # 8% of the time to ~97%, costs nothing, and needs no VPS. Entries
          # are unaffected: process_only_new_candles means it still acts once
          # per closed hourly candle.
          start_freqtrade() {
            freqtrade trade \
              --userdir user_data \
              --config user_data/config/config.cloud.json \
              --strategy HourlyTrend \
              --db-url "sqlite:///${FT_LIVE_DB}" \
              --logfile user_data/logs/cloud.log \
              > user_data/logs/freqtrade.out 2>&1 &
            FT_PID=$!
            echo "freqtrade started (pid $FT_PID)"
          }
          start_freqtrade

          JOB_START=$(date +%s)
          HARD_STOP=$(( JOB_START + 20400 ))   # 5h40m; GitHub kills the job at 5h50m
          CYCLE=0

          # Let freqtrade boot and reconcile before the first report, so the
          # status page is not built from an empty database.
          sleep 90

          while :; do
            CYCLE=$(( CYCLE + 1 ))
            echo "==================== cycle $CYCLE ===================="
            date -u '+%Y-%m-%d %H:%M UTC'

            # ---- is freqtrade still alive? ----
            # A crash used to be invisible: the next hour simply started it
            # again. Now that it is meant to run continuously, a death means
            # the stop is unmanaged until this check notices, so notice loudly.
            set +e
            if kill -0 "$FT_PID" 2>/dev/null; then
              FT_STATE="running (pid $FT_PID)"
            else
              FT_STATE="DIED - restarted"
              echo "freqtrade is not running - restarting it"
              tail -n 20 user_data/logs/freqtrade.out 2>/dev/null || true
              start_freqtrade
            fi
            set -e
            echo "freqtrade: $FT_STATE"

            # ---- consistent snapshot of the live database ----
            # backup() rather than a file copy: freqtrade is writing to this
            # database right now, and only the backup API gives a
            # transactionally consistent image of it.
            set +e
            python bot_tools.py snapshot
            set -e

            # ---- write the diagnosis where it can be read from the repo ----
            {
              echo "run          : ${{ github.run_number }}   cycle: $CYCLE"
              echo "finished     : $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo "freqtrade    : $FT_STATE"
              echo
              echo "----- last 40 log lines -----"
              tail -n 40 user_data/logs/cloud.log 2>&1 || echo "(no log)"
            } > user_data/logs/last_run.txt 2>&1

            # ---- scan the market, then rebuild the status page ----
            # market_scan.py recomputes the strategy's four entry conditions
            # live, so "why has it not traded" is answered with the actual
            # blocker per coin rather than a guess. Never fatal: a failed scan
            # costs one hour of that panel, not the trading.
            python market_scan.py || echo "market scan failed - not fatal"
            # positions.py MUST run before make_status.py - it writes
            # positions.json (live prices, unrealised P&L) and the per-trade
            # charts that the status page then embeds. Out of order, the page
            # silently falls back to showing entry prices with no P&L.
            python positions.py   || echo "position charts failed - not fatal"
            python make_status.py || echo "status page failed - not fatal"

            # ---- save state; a failure here must not kill the loop ----
            # No heredocs anywhere in this loop. YAML strips only the block's
            # base indentation, so a `<<'PY'` nested inside the loop ends with
            # an INDENTED delimiter, bash never finds the end of it, and the
            # step dies of a syntax error before running a single line. That
            # is what broke run #9. The Python lives in bot_tools.py instead.
            # No `checkpoint` and no `rm` of the -wal here any more. Both acted
            # on the file freqtrade had open; deleting a write-ahead log from
            # under a running process is how you lose the last hour of trades.
            # The snapshot above already produced a clean, complete copy.
            set +e
            git add -f README.md chart-*.svg market_scan.json positions.json \
                       user_data/live_cloud.sqlite \
                       user_data/logs/cloud.log user_data/logs/last_run.txt 2>/dev/null
            # Position charts get their OWN add, quoted so git does the
            # globbing rather than bash. Two reasons: with nothing open the
            # glob matches no file, and an unmatched pathspec makes `git add`
            # abort having staged NOTHING - which would silently stop the
            # whole status page being saved. And `-A` with a git-side pattern
            # also stages the DELETIONS when the last position closes, so old
            # charts do not linger on the front page.
            git add -A -- 'pos-*.png' 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "bot: cycle $CYCLE at $(date -u '+%Y-%m-%d %H:%M UTC')"
              git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}"
              git push -q origin "HEAD:${GITHUB_REF_NAME}" && echo "state saved" || echo "push failed, retrying next hour"
            else
              echo "nothing changed"
            fi

            # NOTE: `set -e` is deliberately NOT restored here. Everything from
            # this point on is reporting, not trading, and none of it is worth
            # killing a five-hour job over. With `set -e` active, one failed
            # Telegram call or a momentary network blip would end the step and
            # the bot would stop trading for the rest of the day.

            # ---- tell Telegram, every hour, whatever happened ----
            if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
              MSG=$(python bot_tools.py summary || echo "Hourly check done.")
              curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=${MSG}" \
                -o /dev/null -w "telegram: HTTP %{http_code}\n" || true

              # Then the pictures: one chart per open position, so the phone
              # shows where each trade entered and where it is now without
              # having to ask. Sends nothing when nothing is open.
              python telegram_listener.py sendcharts || echo "chart push failed - not fatal"
            fi

            # ---- stop, or wait for the next hour ----
            # Work out the NEXT cycle first, then decide - the old code checked
            # a deadline here and only afterwards slept up to an hour, so a
            # deadline landing just after a cycle meant it slept straight past
            # GitHub's 5h50m ceiling and was killed mid-sleep. That is why
            # roughly half of all runs ended "cancelled" instead of green: it
            # depended entirely on which minute of the hour the job started.
            NOW=$(date +%s)
            NEXT=$(( NOW - (NOW % 3600) + 3600 + 420 ))
            [ "$(( NEXT - NOW ))" -lt 60 ] && NEXT=$(( NEXT + 3600 ))

            if [ "$NEXT" -ge "$HARD_STOP" ]; then
              echo "the next cycle would fall outside this job's life -"
              echo "ending cleanly now so a queued run can take over"
              break
            fi

            echo "sleeping $(( NEXT - NOW ))s until the next hourly candle"
            sleep "$(( NEXT - NOW ))"
          done

          echo "completed $CYCLE cycles"
